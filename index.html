// ── RADAR ───────────────────────────────────────────────────
const Radar=({active})=>{
  const [ang,setAng]=useState(0);
  const [vis,setVis]=useState([]);
  const raf=useRef();const t0=useRef(null);const prev=useRef(0);
  const DOTS=[{x:55,y:-40,n:"Roberto",d:"1.2km",a:35},{x:-48,y:55,n:"Marcos",d:"2.8km",a:225},
    {x:20,y:70,n:"Carlos",d:"3.4km",a:195},{x:-62,y:-22,n:"Anita",d:"4.1km",a:285}];
  useEffect(()=>{
    if(!active){cancelAnimationFrame(raf.current);return;}
    const step=ts=>{
      if(!t0.current)t0.current=ts;
      const el=(ts-t0.current)/1000;const na=(el*50)%360;
      setAng(na);
      DOTS.forEach((d,i)=>{
        const cross=(prev.current<d.a&&na>=d.a)||(prev.current>300&&na<60&&d.a<60);
        if(cross)setVis(p=>p.includes(i)?p:[...p,i]);
      });
      prev.current=na;raf.current=requestAnimationFrame(step);
    };
    raf.current=requestAnimationFrame(step);
    return()=>cancelAnimationFrame(raf.current);
  },[active]);
  const cx=100,cy=100,r=88;
  const rad=a=>a*Math.PI/180;
  const sx=cx+r*Math.cos(rad(ang-90)),sy=cy+r*Math.sin(rad(ang-90));
  const ex=cx+r*Math.cos(rad(ang-150)),ey=cy+r*Math.sin(rad(ang-150));
  return(
    <div style={{textAlign:"center"}}>
      <svg width={200} height={200} style={{overflow:"visible"}}>
        <defs><radialGradient id="rg">
          <stop offset="0%" stopColor={C.green} stopOpacity=".5"/>
          <stop offset="100%" stopColor={C.green} stopOpacity="0"/>
        </radialGradient></defs>
        {[33,66,88].map(rr=><circle key={rr} cx={cx} cy={cy} r={rr} fill="none" stroke={C.border} strokeWidth={.8}/>)}
        <line x1={cx} y1={cy-r-6} x2={cx} y2={cy+r+6} stroke={C.border} strokeWidth={.4}/>
        <line x1={cx-r-6} y1={cy} x2={cx+r+6} y2={cy} stroke={C.border} strokeWidth={.4}/>
        <path d={`M${cx} ${cy} L${sx} ${sy} A${r} ${r} 0 0 1 ${ex} ${ey} Z`} fill="url(#rg)"/>
        <line x1={cx} y1={cy} x2={sx} y2={sy} stroke={C.green} strokeWidth={2}/>
        <circle cx={cx} cy={cy} r={6} fill={C.green}/>
        <circle cx={cx} cy={cy} r={12} fill={C.green} opacity={.15}/>
        {vis.map(i=>{const d=DOTS[i];return(
          <g key={i}>
            <circle cx={cx+d.x} cy={cy+d.y} r={6} fill={C.orange}/>
            <circle cx={cx+d.x} cy={cy+d.y} r={12} fill={C.orange} opacity={.2}
              style={{animation:"ping 1.8s ease infinite"}}/>
          </g>
        );})}
      </svg>
      <div style={{display:"flex",gap:14,justifyContent:"center",marginTop:6,flexWrap:"wrap"}}>
        {vis.length===0
          ?<p style={{color:C.muted,fontSize:12}}>Varrendo área de 10km...</p>
          :vis.map(i=><span key={i} style={{fontSize:11,color:C.orange}}>{DOTS[i].n} · {DOTS[i].d}</span>)}
      </div>
    </div>
  );
};

// ── LOGIN ───────────────────────────────────────────────────

  const [loading,setLoading]=useState(false);const [err,setErr]=useState("");

  const tog=v=>setCats(p=>p.includes(v)?p.filter(x=>x!==v):[...p,v]);

  const handle=async()=>{
    if(!email||!pass){setErr("Preencha email e senha");return;}
    if(tab==="register"&&!name){setErr("Informe seu nome");return;}
    setErr("");setLoading(true);
    try{
      let uid=null;

        const{data,error}=await SB.auth.signUp({email,password:pass});

        uid=data.user?.id||genId();
      } else {
        const{data,error}=await SB.auth.signInWithPassword({email,password:pass});

        uid=data.user?.id||genId();

      const nm=name||email.split("@")[0];

        id:uid,name:nm,email,role,avatar:av,categories:cats,city:CIDADE

      // Busca perfil salvo
      const{data:p}=await SB.from("profiles").select("*").eq("id",uid).single();
      const user={id:uid,...(p||{name:nm,email,role,avatar:av,categories:cats,rating:null,reviews:0})};
      LS.s("sx_user",user);
      onLogin(user);
    } catch(e){
      // Fallback demo
      const uid=genId();
      const user={id:uid,name:name||email.split("@")[0],email,role,
        avatar:role==="provider"?"👷":"👤",categories:cats,rating:null,reviews:0};

        <p style={{color:C.muted,fontSize:13,marginTop:4}}>Serviços na palma da mão · {CIDADE}</p>
        <div style={{display:"inline-flex",alignItems:"center",gap:6,marginTop:10,
          background:"rgba(0,212,106,.08)",borderRadius:8,padding:"4px 12px",
          border:"1px solid rgba(0,212,106,.2)"}}>
          <span style={{width:7,height:7,borderRadius:"50%",background:C.green,
            boxShadow:"0 0 6px #00D46A"}}/>
          <span style={{fontSize:11,color:C.green,fontWeight:600}}>Supabase conectado ✓</span>
        </div>
      </div>

      <div style={{padding:"0 24px 40px"}}>
        <div style={{display:"flex",background:C.carbon,borderRadius:14,padding:4,
          border:`1px solid ${C.border}`,marginBottom:20}}>
          {[["login","Entrar"],["register","Cadastrar"]].map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:"10px 8px",
              borderRadius:10,border:"none",cursor:"pointer",fontWeight:700,fontSize:13,
              fontFamily:"inherit",background:tab===k?C.green:"transparent",

          ))}
        </div>

        {tab==="register"&&<FI label="Seu nome *" val={name} set={setName} ph="João da Silva"/>}

        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:11,fontWeight:700,color:C.muted,
            textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Tipo de conta</label>

const ServiceReq=({onBack,onSubmit,initCat="",user})=>{
  const [step,setStep]=useState(initCat?1:0);
  const [cat,setCat]=useState(initCat);
  const [title,setTitle]=useState("");const [desc,setDesc]=useState("");
  const [addr,setAddr]=useState(CIDADE);const [urgency,setUrgency]=useState("normal");
  const [bmin,setBmin]=useState("");const [bmax,setBmax]=useState("");
  const [sched,setSched]=useState("");
  const [loading,setLoading]=useState(false);
  const catObj=getCat(cat);
  const ok=()=>{
    if(step===0)return!!cat;
    if(step===1)return title.length>=3&&desc.length>=8;
    if(step===2)return addr.length>=5;
    return true;
  };

    setLoading(true);
    const sv={
      id:genId(),title,description:desc,category:cat,address:addr,
      lat:-22.7406+(Math.random()-.5)*.02,lng:-43.7075+(Math.random()-.5)*.02,

      budget_max:parseFloat(bmax)||0,final_price:null,
      client_id:user.id,client_name:user.name,
      scheduled_at:sched||null,created_at:new Date().toISOString(),

    try{await SB.from("services").insert([sv]);}catch(e){console.warn(e);}
    onSubmit({...sv,proposals:[]});

        <div style={{height:3,background:C.border,borderRadius:3}}>

                </button>

              background:C.carbon,borderRadius:12,padding:"10px 12px",border:`1px solid ${C.border}`}}>

                (bmax?[`${fmtR(parseFloat(bmin)||0)} — ${fmtR(parseFloat(bmax)||0)}`,"💰"]:null),
                [{baixa:"Sem pressa",normal:"Normal",alta:"Urgente"}[urgency],"⚡"],
                (sched?[new Date(sched).toLocaleString("pt-BR"),"📅"]:null)

      </div>
      <div style={{padding:"12px 16px 16px",borderTop:`1px solid ${C.border}`,background:C.dark,flexShrink:0}}>

          </Card>
        )}

        {/* Avaliação */}
        {isC&&svc.status==="COMPLETED"&&!svc.rated&&(
          <>
            {!showR&&<Btn ch="⭐ Avaliar o prestador" full v="s" onClick={()=>setShowR(true)} sx={{marginBottom:12}}/>}
            {showR&&(
              <Card sx={{marginBottom:12}}>
                <p style={{fontWeight:700,color:C.text,fontSize:15,marginBottom:12}}>Como foi o serviço?</p>
                <div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:14}}>
                  {[1,2,3,4,5].map(n=>(
                    <button key={n} onClick={()=>setRating(n)}
                      style={{background:"none",border:"none",fontSize:30,cursor:"pointer",opacity:n<=rating?1:.25}}>⭐</button>
                  ))}
                </div>
                <FI label="Comentário (opcional)" val={rNote} set={setRNote} ph="Como foi o serviço?" rows={2}/>
                <Btn ch="Enviar avaliação" full onClick={()=>onRate(svc.id,rating,rNote)}/>
              </Card>
            )}
          </>
        )}
        {isC&&svc.status==="COMPLETED"&&svc.rated&&(
          <div style={{background:"rgba(0,212,106,.06)",border:"1px solid rgba(0,212,106,.2)",
            borderRadius:12,padding:14,textAlign:"center",marginBottom:12}}>
            <p style={{color:C.green,fontWeight:700}}>✅ Serviço avaliado com {svc.rating} estrelas</p>
          </div>
        )}

        {/* Prestador — enviar proposta */}
        {!isC&&["PENDING","NEGOTIATING"].includes(svc.status)&&!myProp&&(
          <div style={{marginBottom:12}}>
            {!showF?(
              <Btn ch="💰 Enviar proposta para este serviço" full onClick={()=>setShowF(true)}/>
            ):(
              <Card>
                <p style={{fontWeight:700,color:C.text,fontSize:15,marginBottom:12}}>Sua proposta</p>

                  <FI label="Horas estimadas" type="number" val={pf.hours} set={v=>setPf(f=>({...f,hours:v}))} ph="2"/>
                </div>
                <FI label="Descrição *" val={pf.description} set={v=>setPf(f=>({...f,description:v}))}
                  ph="O que você vai fazer, material incluso?" rows={3}/>
                <FI label="Garantia (opcional)" val={pf.warranty} set={v=>setPf(f=>({...f,warranty:v}))} ph="Ex: 30 dias"/>

              </Card>

        {!isC&&myProp&&(
          <Card>
            <p style={{fontWeight:700,color:C.text,fontSize:14,marginBottom:8}}>Sua proposta enviada</p>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <p style={{color:C.muted,fontSize:13}}>{myProp.description}</p>
                {myProp.warranty&&<p style={{color:C.green,fontSize:12,marginTop:4}}>🛡️ {myProp.warranty}</p>}
              </div>
              <div style={{textAlign:"right"}}>
                <p style={{fontWeight:800,color:C.green,fontSize:22}}>{fmtR(myProp.price)}</p>
                <Chip l={myProp.status==="ACCEPTED"?"✅ Aceita":myProp.status==="REJECTED"?"❌ Recusada":"⏳ Aguardando"}
                  c={myProp.status==="ACCEPTED"?C.green:myProp.status==="REJECTED"?C.red:C.yellow}
                  bg={myProp.status==="ACCEPTED"?"rgba(0,212,106,.1)":myProp.status==="REJECTED"?"rgba(255,71,87,.1)":"rgba(255,208,70,.1)"}
                  bd={myProp.status==="ACCEPTED"?"rgba(0,212,106,.3)":myProp.status==="REJECTED"?"rgba(255,71,87,.3)":"rgba(255,208,70,.3)"}/>

      {/* Ações fixas */}
      <div style={{position:"absolute",bottom:0,left:0,right:0,padding:"12px 16px 16px",
        background:"rgba(13,17,23,.97)",borderTop:`1px solid ${C.border}`,backdropFilter:"blur(8px)"}}>
        {isC&&svc.status==="CONFIRMED"&&(
          <Btn ch={`💳 Pagar ${fmtR(svc.final_price)}`} full onClick={()=>onPay(svc.id)}/>
        )}
        {isC&&svc.status==="IN_PROGRESS"&&(
          <Btn ch="✅ Confirmar conclusão do serviço" full onClick={()=>onComplete(svc.id)}/>
        )}
        {isC&&svc.status==="COMPLETED"&&(
          <div style={{background:"rgba(0,212,106,.08)",border:"1px solid rgba(0,212,106,.3)",
            borderRadius:12,padding:14,textAlign:"center"}}>

            borderRadius:12,padding:14,textAlign:"center"}}>
            <p style={{color:C.orange,fontWeight:700}}>🔨 Em andamento — aguardando confirmação do cliente</p>
          </div>
        )}
      </div>
    </div>
  );
};

// ── PAYMENT ─────────────────────────────────────────────────
const Payment=({svc,onBack,onConfirm})=>{
  const [method,setMethod]=useState("pix");
  const [loading,setLoading]=useState(false);
  const [pixReady,setPixReady]=useState(false);
  const [done,setDone]=useState(false);
  const [cn,setCn]=useState("");const [cname,setCname]=useState("");
  const [exp,setExp]=useState("");const [cvv,setCvv]=useState("");

  const total=svc.final_price||0;
  const taxa=total*TAXA;
  const net=total-taxa;

  const pay=async()=>{
    if(method==="pix"&&!pixReady){setLoading(true);await new Promise(r=>setTimeout(r,900));setLoading(false);setPixReady(true);return;}
    if(method==="card"&&(!cn||!cname||!exp||!cvv)){alert("Preencha todos os dados do cartão");return;}
    setLoading(true);
    await SB.from("transactions").insert([{
      id:genId(),service_id:svc.id,gross_amount:total,
      platform_fee:taxa,net_amount:net,method,status:"CONFIRMED",
      created_at:new Date().toISOString()
    }]).catch(()=>{});
    await new Promise(r=>setTimeout(r,1200));
    setLoading(false);setDone(true);setTimeout(()=>onConfirm(svc.id),2000);
  };

  if(done)return(
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",
      justifyContent:"center",gap:16,padding:32,background:C.dark}}>
      <div style={{width:100,height:100,background:"rgba(0,212,106,.1)",borderRadius:"50%",
        display:"flex",alignItems:"center",justifyContent:"center",fontSize:50,
        boxShadow:"0 0 60px rgba(0,212,106,.25)"}}>✅</div>
      <h2 style={{fontWeight:800,fontSize:22,color:C.text,textAlign:"center",fontFamily:"Space Grotesk,sans-serif"}}>Pagamento confirmado!</h2>
      <p style={{color:C.muted,textAlign:"center",lineHeight:1.6}}>O prestador foi notificado e iniciará o serviço em breve.</p>
      <Card sx={{width:"100%"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
          <span style={{color:C.muted,fontSize:13}}>Total pago</span>
          <span style={{color:C.green,fontWeight:700}}>{fmtR(total)}</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
          <span style={{color:C.muted,fontSize:13}}>Taxa ServiX ({(TAXA*100).toFixed(2)}%)</span>
          <span style={{color:C.muted,fontSize:13}}>− {fmtR(taxa)}</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between"}}>
          <span style={{color:C.muted,fontSize:13}}>Prestador recebe</span>
          <span style={{color:C.text,fontWeight:700}}>{fmtR(net)}</span>
        </div>
      </Card>
    </div>
  );

  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <Bar title="Pagamento" onBack={onBack}/>
      <div style={{flex:1,overflowY:"auto",padding:"14px 16px 100px"}}>
        <Card sx={{marginBottom:14}}>
          <p style={{fontSize:11,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>Resumo</p>
          <p style={{fontWeight:600,color:C.text,fontSize:14,marginBottom:10}}>{svc.title}</p>
          {[["Valor do serviço",fmtR(total),C.text],
            [`Taxa ServiX (${(TAXA*100).toFixed(2)}%)`,`− ${fmtR(taxa)}`,C.muted]
          ].map(([k,v,c])=>(
            <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderTop:`1px solid ${C.border}`}}>
              <span style={{color:C.muted,fontSize:13}}>{k}</span>
              <span style={{color:c,fontSize:13}}>{v}</span>
            </div>
          ))}
          <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderTop:`1px solid ${C.border}`}}>
            <span style={{fontWeight:700,color:C.text,fontSize:15}}>Total</span>
            <span style={{fontWeight:800,color:C.green,fontSize:24}}>{fmtR(total)}</span>
          </div>
          <p style={{fontSize:11,color:C.sub,textAlign:"right",marginTop:2}}>Prestador recebe: {fmtR(net)}</p>
        </Card>

        <p style={{fontSize:11,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>Forma de pagamento</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          {[["pix","📱","PIX","Instantâneo · grátis"],["card","💳","Cartão","Crédito ou débito"]].map(([k,ic,l,sub])=>(
            <button key={k} onClick={()=>{setMethod(k);setPixReady(false);}}
              style={{padding:"14px 10px",borderRadius:14,textAlign:"center",
                border:`2px solid ${method===k?C.green:C.border}`,
                background:method===k?"rgba(0,212,106,.08)":C.carbon,cursor:"pointer"}}>
              <div style={{fontSize:26,marginBottom:6}}>{ic}</div>
              <div style={{fontWeight:700,fontSize:13,color:method===k?C.text:C.muted,fontFamily:"inherit"}}>{l}</div>
              <div style={{fontSize:10,color:C.sub,fontFamily:"inherit",marginTop:2}}>{sub}</div>
            </button>
          ))}
        </div>

        {method==="pix"&&pixReady&&(
          <Card sx={{textAlign:"center",marginBottom:14}}>
            <p style={{fontWeight:700,color:C.text,fontSize:14,marginBottom:14}}>Escaneie o QR Code PIX</p>
            <div style={{width:164,height:164,background:C.surface,borderRadius:12,
              border:`2px solid ${C.border}`,margin:"0 auto 14px",
              display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>
              <svg width={144} height={144} viewBox="0 0 144 144">
                {Array.from({length:196},(_,i)=>{
                  const x=(i%14)*10,y=Math.floor(i/14)*10;
                  const edge=(x<20&&y<20)||(x>100&&y<20)||(x<20&&y>100);
                  return <rect key={i} x={x} y={y} width={9} height={9} rx={1}
                    fill={edge||Math.random()>.42?C.text:"transparent"}/>;
                })}
              </svg>
            </div>
            <div style={{background:C.surface,borderRadius:10,padding:"10px 14px",marginBottom:12}}>
              <p style={{fontSize:10,color:C.muted,fontFamily:"monospace",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                00020126580014br.gov.bcb.pix0136{svc.id.slice(0,10)}...
              </p>
            </div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:C.yellow,animation:"pulse 1s ease infinite"}}/>
              <p style={{color:C.muted,fontSize:12}}>Aguardando confirmação...</p>
            </div>
          </Card>
        )}

        {method==="card"&&(
          <Card sx={{marginBottom:14}}>
            <p style={{fontWeight:700,color:C.text,fontSize:14,marginBottom:12}}>Dados do cartão</p>
            <FI label="Número" val={cn} set={setCn} ph="0000 0000 0000 0000"/>
            <FI label="Nome no cartão" val={cname} set={setCname} ph="JOAO DA SILVA"/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <FI label="Validade" val={exp} set={setExp} ph="MM/AA"/>
              <FI label="CVV" val={cvv} set={setCvv} ph="123"/>
            </div>
          </Card>
        )}

        <div style={{background:C.surface,borderRadius:12,padding:14,border:`1px solid ${C.border}`}}>
          <p style={{color:C.muted,fontSize:11,textAlign:"center",lineHeight:1.7}}>
            🔒 Pagamento seguro. O valor é retido e liberado ao prestador só após você confirmar a conclusão do serviço.
          </p>
        </div>
      </div>
      <div style={{padding:"12px 16px 16px",borderTop:`1px solid ${C.border}`,background:C.dark}}>
        <Btn ch={loading?<Spin/>:
          method==="pix"&&!pixReady?"📱 Gerar QR Code PIX":
          method==="pix"?"✅ Simular pagamento PIX":
          "💳 Pagar com cartão"} full disabled={loading} onClick={pay}/>
      </div>
    </div>
  );
};

// ── WALLET ───────────────────────────────────────────────────
const Wallet=({user,services,onBack})=>{
  const done=services.filter(s=>s.status==="COMPLETED");
  const gross=done.reduce((a,s)=>a+(s.final_price||0),0);
  const taxa=gross*TAXA;const net=gross-taxa;

          <p style={{fontWeight:900,fontSize:42,color:C.green,fontFamily:"Space Grotesk,sans-serif",lineHeight:1}}>{fmtR(user.role==="provider"?net:gross)}</p>

        </div>

        <Card sx={{marginBottom:14}}>
          <p style={{fontSize:11,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:12}}>Resumo financeiro</p>
          {[["Valor bruto total",fmtR(gross),C.text],
            [`Taxa ServiX (${(TAXA*100).toFixed(2)}%)`,`− ${fmtR(taxa)}`,C.red],
            [user.role==="provider"?"Você recebeu (líquido)":"Total pago",fmtR(user.role==="provider"?net:gross),C.green]

            <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"9px 0",borderBottom:i<2?`1px solid ${C.border}`:"none"}}>
              <span style={{color:C.muted,fontSize:13}}>{k}</span>
              <span style={{color:c,fontWeight:i===2?700:600,fontSize:13}}>{v}</span>
            </div>

        </Card>

        {user.role==="provider"&&net>0&&(
          <div style={{marginBottom:14}}>
            <Btn ch="💸 Solicitar saque via PIX" full v="s"
              onClick={()=>alert(`Saque de ${fmtR(net)}

Integração MercadoPago em breve!
Chave PIX: ${user.email}`)}/>
            <p style={{color:C.sub,fontSize:11,textAlign:"center",marginTop:8}}>Saques disponíveis em D+1 após conclusão</p>

        {done.length>0&&(
          <>
            <p style={{fontSize:11,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>Histórico</p>
            {done.map(sv=>(
              <div key={sv.id} style={{background:C.carbon,borderRadius:12,padding:12,marginBottom:8,border:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:38,height:38,background:C.surface,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{getCat(sv.category).i}</div>
                <div style={{flex:1}}>
                  <p style={{fontWeight:600,color:C.text,fontSize:13}}>{sv.title}</p>
                  <p style={{color:C.muted,fontSize:11,marginTop:1}}>{new Date(sv.created_at).toLocaleDateString("pt-BR")}</p>
                </div>
                <div style={{textAlign:"right"}}>
                  <p style={{color:C.green,fontWeight:700}}>{fmtR(sv.final_price)}</p>
                  {user.role==="provider"&&<p style={{color:C.sub,fontSize:10}}>líq: {fmtR((sv.final_price||0)*(1-TAXA))}</p>}
                </div>
              </div>
            ))}
          </>
        )}
      </div>
    </div>
  );
};

// ── APP ──────────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(()=>LS.g("sx_user",null));
  const [screen,setScreen]=useState("home");
  const [param,setParam]=useState(null);
  const [svcs,setSvcs]=useState([]);
  const [loading,setLoading]=useState(false);
  const [notifs,setNotifs]=useState(()=>LS.g("sx_notifs",[
    {id:"n1",icon:"💰",title:"Bem-vindo ao ServiX!",body:"Plataforma conectada ao Supabase. Beta em Seropédica/RJ.",time:"agora",read:false},
    {id:"n2",icon:"📡",title:"Serviços disponíveis",body:"Há chamados abertos na sua área. Verifique o radar.",time:"1min",read:false},
  ]));
  const [toast,setToast]=useState({show:false,msg:""});

  // Carrega serviços do Supabase
  const loadSvcs=useCallback(async()=>{
    if(!user)return;
    setLoading(true);
    try{
      // Busca serviços + propostas
      const{data:svData}=await SB.from("services").select("*").order("created_at",{ascending:false}).limit(50);
      if(!svData||svData.length===0){setLoading(false);return;}
      const ids=svData.map(s=>s.id);
      const{data:prData}=await SB.from("proposals").select("*").in("service_id",ids);
      const merged=svData.map(s=>({...s,proposals:(prData||[]).filter(p=>p.service_id===s.id)}));
      setSvcs(merged);
    }catch(e){console.warn("Load error:",e);}
    setLoading(false);
  },[user]);

  useEffect(()=>{if(user)loadSvcs();},[user]);

  // Realtime
  useEffect(()=>{
    if(!user)return;
    const ch=SB.channel("servix-rt")
      .on("postgres_changes",{event:"*",schema:"public",table:"services"},()=>loadSvcs())
      .on("postgres_changes",{event:"*",schema:"public",table:"proposals"},()=>loadSvcs())
      .subscribe();
    return()=>SB.removeChannel(ch);
  },[user,loadSvcs]);

  useEffect(()=>LS.s("sx_notifs",notifs),[notifs]);

  const toast2=useCallback(msg=>{setToast({show:true,msg});setTimeout(()=>setToast(t=>({...t,show:false})),2800);},[]);
  const nav=useCallback((sc,p=null)=>{setScreen(sc);setParam(p);},[]);
  const goNav=useCallback(sc=>{setScreen(sc);setParam(null);},[]);
  const addN=useCallback((icon,title,body)=>setNotifs(p=>[{id:genId(),icon,title,body,time:"agora",read:false},...p]),[]);

  const login=useCallback(u=>{setUser(u);setScreen("home");toast2(`Bem-vindo, ${u.name.split(" ")[0]}! 👋`);},[toast2]);
  const logout=useCallback(async()=>{await SB.auth.signOut().catch(()=>{});LS.d("sx_user");setUser(null);setScreen("home");},[]);
  const updateUser=useCallback(u=>{setUser(u);LS.s("sx_user",u);toast2("Perfil atualizado!");},[toast2]);

  const newSvc=useCallback(sv=>{
    setSvcs(p=>[sv,...p]);
    setTimeout(()=>addN("📡","Prestadores notificados!",`"${sv.title}" enviado para profissionais próximos.`),1200);
    nav("service",sv.id);toast2("✅ Solicitação enviada!");
  },[nav,toast2,addN]);

  const accept=useCallback(async(sId,pId)=>{
    const prop=svcs.find(s=>s.id===sId)?.proposals?.find(p=>p.id===pId);
    if(!prop)return;
    await SB.from("services").update({status:"CONFIRMED",final_price:prop.price}).eq("id",sId).catch(()=>{});
    await SB.from("proposals").update({status:"ACCEPTED"}).eq("id",pId).catch(()=>{});
    await SB.from("proposals").update({status:"REJECTED"}).eq("service_id",sId).neq("id",pId).catch(()=>{});
    setSvcs(p=>p.map(s=>{if(s.id!==sId)return s;
      return{...s,status:"CONFIRMED",final_price:prop.price,
        proposals:s.proposals.map(pp=>({...pp,status:pp.id===pId?"ACCEPTED":"REJECTED"}))};
    }));
    addN("🎉","Proposta aceita!","Faça o pagamento para confirmar o serviço.");
    toast2("✅ Proposta aceita!");
  },[svcs,toast2,addN]);

  const reject=useCallback(async(sId,pId)=>{
    await SB.from("proposals").update({status:"REJECTED"}).eq("id",pId).catch(()=>{});
    setSvcs(p=>p.map(s=>{if(s.id!==sId)return s;
      const rem=s.proposals.filter(pp=>pp.id!==pId&&pp.status==="PENDING");
      return{...s,status:rem.length>0?"NEGOTIATING":"PENDING",
        proposals:s.proposals.map(pp=>({...pp,status:pp.id===pId?"REJECTED":pp.status}))};
    }));
    toast2("Proposta recusada");
  },[toast2]);

  const complete=useCallback(async(sId)=>{
    await SB.from("services").update({status:"COMPLETED",completed_at:new Date().toISOString()}).eq("id",sId).catch(()=>{});
    setSvcs(p=>p.map(s=>s.id===sId?{...s,status:"COMPLETED"}:s));
    addN("⭐","Serviço concluído!","Avalie o prestador para ajudar outros clientes.");
    toast2("✅ Concluído! Obrigado.");nav("service",sId);
  },[nav,toast2,addN]);

  const payConfirm=useCallback(async(sId)=>{
    await SB.from("services").update({status:"IN_PROGRESS"}).eq("id",sId).catch(()=>{});
    setSvcs(p=>p.map(s=>s.id===sId?{...s,status:"IN_PROGRESS"}:s));
    addN("💳","Pagamento confirmado!","O prestador foi notificado.");
    toast2("💳 Pagamento realizado!");nav("service",sId);
  },[nav,toast2,addN]);

  const sendProp=useCallback(async(sId,data)=>{
    if(!user)return;
    const pr={id:genId(),service_id:sId,provider_id:user.id,provider_name:user.name,
      avatar:user.avatar||"👷",rating:user.rating||4.8,reviews:user.reviews||0,
      price:data.price,description:data.description,hours:data.hours||null,
      warranty:data.warranty||null,status:"PENDING",created_at:new Date().toISOString()};
    await SB.from("proposals").insert([pr]).catch(()=>{});
    setSvcs(p=>p.map(s=>s.id!==sId?s:{...s,status:"NEGOTIATING",proposals:[...s.proposals,pr]}));
    addN("💰","Proposta enviada!",`Proposta de ${fmtR(data.price)} enviada.`);
    toast2(`✅ Proposta de ${fmtR(data.price)} enviada!`);
  },[user,toast2,addN]);

  const rate=useCallback(async(sId,stars,note)=>{
    await SB.from("services").update({rating:stars,rating_note:note,rated:true}).eq("id",sId).catch(()=>{});
    setSvcs(p=>p.map(s=>s.id===sId?{...s,rating:stars,rating_note:note,rated:true}:s));
    addN("⭐","Avaliação enviada!",`Você deu ${stars} estrelas.`);toast2("⭐ Avaliação enviada!");
  },[toast2,addN]);

  const unread=notifs.filter(n=>!n.read).length;
  const role=user?.role;
  const clientSvcs=svcs.filter(s=>s.client_id===user?.id||s.client_id==="demo_client_01");
  const provSvcs=svcs.filter(s=>(s.proposals||[]).some(p=>p.provider_id===user?.id));
  const curSvc=param?svcs.find(s=>s.id===param):null;
  const inNav=["home","wallet","notif","profile"].includes(screen);

  if(!user)return(<div style={{display:"flex",flexDirection:"column",height:"100%"}}><Login onLogin={login}/></div>);

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {inNav&&(
        <>
          <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            {screen==="home"&&role==="client"&&<ClientHome user={user} services={clientSvcs} onNav={nav} onReq={cat=>nav("request",cat||"")} loading={loading}/>}
            {screen==="home"&&role==="provider"&&<ProviderHome user={user} services={provSvcs} allSvcs={svcs} onNav={nav} loading={loading}/>}
            {screen==="wallet"&&<Wallet user={user} services={role==="client"?clientSvcs:provSvcs} onBack={()=>goNav("home")}/>}
            {screen==="notif"&&<Notifs notifs={notifs} onBack={()=>goNav("home")}
              onRead={id=>setNotifs(n=>n.map(x=>x.id===id?{...x,read:true}:x))}
              onClear={()=>setNotifs([])}/>}
            {screen==="profile"&&<Profile user={user} onBack={()=>goNav("home")} onLogout={logout}
              onUpdate={updateUser} history={[...clientSvcs,...provSvcs].filter(s=>s.status==="COMPLETED")}/>}
          </div>
          <Nav sc={screen} role={role} go={goNav} unread={unread}/>
        </>
      )}
      {screen==="request"&&<ServiceReq onBack={()=>setScreen("home")} onSubmit={newSvc} initCat={param||""} user={user}/>}
      {screen==="service"&&curSvc&&<SvcDetail svc={curSvc} user={user} onBack={()=>{setScreen("home");setParam(null);}}
        onAccept={accept} onReject={reject} onComplete={complete}
        onPay={id=>nav("payment",id)} onRate={rate} onSendProp={sendProp}/>}
      {screen==="payment"&&param&&(()=>{const sv=svcs.find(s=>s.id===param);return sv?<Payment svc={sv} onBack={()=>nav("service",param)} onConfirm={payConfirm}/>:null;})()}
      <Toast msg={toast.msg} show={toast.show}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

    React.useEffect(()=>{ if(auth) load(); },[auth]);

    const updateStatus = async (id, status) => {
      await SB2.from('services').update({status}).eq('id',id);
      setData(d=>({...d, services: d.services.map(s=>s.id===id?{...s,status}:s)}));
    };

    const deleteService = async (id) => {
      if(!confirm('Excluir serviço?')) return;
      await SB2.from('services').delete().eq('id',id);
      setData(d=>({...d, services: d.services.filter(s=>s.id!==id)}));
    };

    const inp2 = {background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,
      padding:'10px 14px',color:C.text,fontSize:14,fontFamily:'inherit',outline:'none',width:'100%',boxSizing:'border-box'};

    if(!auth) return (
      <div style={{minHeight:'100vh',background:C.dark,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
        <div style={{background:C.carbon,borderRadius:20,padding:32,width:'100%',maxWidth:360,border:`1px solid ${C.border}`}}>
          <div style={{textAlign:'center',marginBottom:24}}>
            <div style={{fontSize:40,marginBottom:8}}>🔐</div>
            <h2 style={{color:C.text,fontFamily:'Space Grotesk,sans-serif',fontSize:22,fontWeight:800}}>Painel Admin</h2>
            <p style={{color:C.muted,fontSize:13,marginTop:4}}>ServiX — Acesso restrito</p>
          </div>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)}
            placeholder="Senha do admin..." style={inp2}
            onKeyPress={e=>e.key==='Enter'&&(pass===ADMIN_PASS?setAuth(true):alert('Senha incorreta'))}/>
          <button onClick={()=>pass===ADMIN_PASS?setAuth(true):alert('Senha incorreta')}
            style={{width:'100%',marginTop:12,padding:'12px',background:C.green,color:C.dark,
              border:'none',borderRadius:12,fontWeight:700,fontSize:14,cursor:'pointer',fontFamily:'inherit'}}>
            Acessar painel →
          </button>
          <p style={{color:C.muted,fontSize:11,textAlign:'center',marginTop:14}}>
            <a href="/" style={{color:C.muted}}>← Voltar ao app</a>
          </p>
        </div>
      </div>
    );

    const fmtR = n => n!=null ? `R$ ${Number(n).toFixed(2).replace('.',',')}` : '—';
    const ST_COLORS = {PENDING:C.yellow,NEGOTIATING:C.blue,CONFIRMED:C.green,IN_PROGRESS:C.orange,COMPLETED:C.green,CANCELLED:C.red};

    return (
      <div style={{minHeight:'100vh',background:C.dark,fontFamily:'DM Sans,sans-serif',color:C.text}}>
        {/* Header */}
        <div style={{background:C.carbon,borderBottom:`1px solid ${C.border}`,padding:'14px 20px',
          display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:22}}>🔧</span>
            <div>
              <h1 style={{fontSize:18,fontWeight:800,fontFamily:'Space Grotesk,sans-serif',margin:0}}>ServiX Admin</h1>
              <p style={{color:C.muted,fontSize:11,margin:0}}>Painel de controle · Seropédica/RJ</p>
            </div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <button onClick={load} style={{background:C.surface,border:`1px solid ${C.border}`,
              borderRadius:8,padding:'6px 12px',color:C.muted,cursor:'pointer',fontSize:12,fontFamily:'inherit'}}>
              {loading ? '⏳' : '🔄 Atualizar'}
            </button>
            <a href="/" style={{background:'rgba(255,71,87,.1)',border:'1px solid rgba(255,71,87,.3)',
              borderRadius:8,padding:'6px 12px',color:C.red,fontSize:12,textDecoration:'none'}}>Sair</a>
          </div>
        </div>

        {/* Tabs */}
        <div style={{display:'flex',gap:4,padding:'10px 16px',background:C.carbon,
          borderBottom:`1px solid ${C.border}`,overflowX:'auto'}}>
          {[['dashboard','📊 Dashboard'],['services','📋 Serviços'],['providers','🔧 Prestadores']].map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)} style={{padding:'7px 16px',borderRadius:8,
              border:'none',cursor:'pointer',fontWeight:700,fontSize:12,fontFamily:'inherit',
              background:tab===k?C.green:'transparent',color:tab===k?C.dark:C.muted,whiteSpace:'nowrap'}}>
              {l}
            </button>
          ))}
        </div>

        <div style={{padding:'16px 16px 40px',maxWidth:800,margin:'0 auto'}}>

          {/* DASHBOARD */}
          {tab==='dashboard' && (
            <div>
              <h2 style={{fontSize:18,fontWeight:800,fontFamily:'Space Grotesk,sans-serif',marginBottom:16}}>Visão geral</h2>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:20}}>
                {[
                  {v:data.stats.total_services||0,l:'Total de serviços',c:C.blue},
                  {v:data.stats.active||0,l:'Ativos agora',c:C.orange},
                  {v:data.stats.completed||0,l:'Concluídos',c:C.green},
                  {v:data.stats.providers||0,l:'Prestadores',c:C.purple||'#8B5CF6'},
                  {v:fmtR(data.stats.gmv||0),l:'Volume total (GMV)',c:C.yellow},
                  {v:fmtR(data.stats.revenue||0),l:'Receita ServiX (4,99%)',c:C.green},
                ].map(s=>(
                  <div key={s.l} style={{background:C.carbon,border:`1px solid ${C.border}`,
                    borderRadius:14,padding:16,textAlign:'center'}}>
                    <div style={{fontWeight:900,fontSize:26,color:s.c,fontFamily:'Space Grotesk,sans-serif'}}>{s.v}</div>
                    <div style={{color:C.muted,fontSize:11,marginTop:4,textTransform:'uppercase',letterSpacing:'.06em'}}>{s.l}</div>
                  </div>
                ))}
              </div>
              <div style={{background:C.carbon,borderRadius:14,padding:16,border:`1px solid ${C.border}`}}>
                <h3 style={{fontWeight:700,color:C.text,marginBottom:12}}>Status dos serviços</h3>
                {['PENDING','NEGOTIATING','CONFIRMED','IN_PROGRESS','COMPLETED','CANCELLED'].map(st=>{
                  const count = (data.services||[]).filter(s=>s.status===st).length;
                  const pct = data.stats.total_services ? Math.round(count/data.stats.total_services*100) : 0;
                  const labels = {PENDING:'Aguardando',NEGOTIATING:'Propostas',CONFIRMED:'Confirmado',IN_PROGRESS:'Andamento',COMPLETED:'Concluído',CANCELLED:'Cancelado'};
                  return (
                    <div key={st} style={{marginBottom:10}}>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                        <span style={{color:C.text,fontSize:13}}>{labels[st]}</span>
                        <span style={{color:ST_COLORS[st],fontSize:12,fontWeight:700}}>{count} ({pct}%)</span>
                      </div>
                      <div style={{height:4,background:C.border,borderRadius:4}}>
                        <div style={{height:'100%',background:ST_COLORS[st],borderRadius:4,width:`${pct}%`}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* SERVICES */}
          {tab==='services' && (
            <div>
              <h2 style={{fontSize:18,fontWeight:800,fontFamily:'Space Grotesk,sans-serif',marginBottom:16}}>
                Todos os serviços ({(data.services||[]).length})
              </h2>
              {(data.services||[]).map(sv=>(
                <div key={sv.id} style={{background:C.carbon,border:`1px solid ${C.border}`,
                  borderRadius:12,padding:14,marginBottom:10}}>
                  <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10,marginBottom:8}}>
                    <div style={{flex:1}}>
                      <p style={{fontWeight:700,color:C.text,fontSize:14,marginBottom:2}}>{sv.title}</p>
                      <p style={{color:C.muted,fontSize:12}}>📍 {sv.address}</p>
                      <p style={{color:C.muted,fontSize:11,marginTop:2}}>Cliente: {sv.client_name||sv.client_id?.slice(0,8)} · {new Date(sv.created_at).toLocaleDateString('pt-BR')}</p>
                    </div>
                    <div style={{textAlign:'right',flexShrink:0}}>
                      <div style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',
                        borderRadius:8,fontSize:11,fontWeight:700,color:ST_COLORS[sv.status],
                        background:`${ST_COLORS[sv.status]}15`,border:`1px solid ${ST_COLORS[sv.status]}40`,marginBottom:6}}>
                        {sv.status}
                      </div>
                      {sv.final_price && <p style={{color:C.green,fontWeight:700,fontSize:13}}>{fmtR(sv.final_price)}</p>}
                    </div>
                  </div>
                  <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                    {['CONFIRMED','IN_PROGRESS','COMPLETED','CANCELLED'].map(st=>(
                      <button key={st} onClick={()=>updateStatus(sv.id,st)}
                        disabled={sv.status===st}
                        style={{padding:'5px 10px',borderRadius:8,border:`1px solid ${ST_COLORS[st]}40`,
                          background:sv.status===st?`${ST_COLORS[st]}20`:'transparent',
                          color:sv.status===st?ST_COLORS[st]:C.muted,fontSize:10,fontWeight:600,
                          cursor:sv.status===st?'default':'pointer',fontFamily:'inherit'}}>
                        {st}
                      </button>
                    ))}
                    <button onClick={()=>deleteService(sv.id)}
                      style={{padding:'5px 10px',borderRadius:8,border:'1px solid rgba(255,71,87,.3)',
                        background:'rgba(255,71,87,.06)',color:C.red,fontSize:10,fontWeight:600,
                        cursor:'pointer',fontFamily:'inherit',marginLeft:'auto'}}>
                      🗑️ Excluir
                    </button>
                  </div>
                </div>
              ))}
              {!(data.services||[]).length && <p style={{color:C.muted,textAlign:'center',padding:'40px 0'}}>Nenhum serviço</p>}
            </div>
          )}

          {/* PROVIDERS */}
          {tab==='providers' && (
            <div>
              <h2 style={{fontSize:18,fontWeight:800,fontFamily:'Space Grotesk,sans-serif',marginBottom:16}}>
                Prestadores ({(data.providers||[]).length})
              </h2>
              {(data.providers||[]).map(p=>(
                <div key={p.id} style={{background:C.carbon,border:`1px solid ${C.border}`,
                  borderRadius:12,padding:14,marginBottom:10,display:'flex',gap:12,alignItems:'center'}}>
                  <div style={{width:46,height:46,background:C.surface,borderRadius:'50%',
                    display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}}>
                    {p.avatar||'👷'}
                  </div>
                  <div style={{flex:1}}>
                    <p style={{fontWeight:700,color:C.text,fontSize:14}}>{p.name}</p>
                    <p style={{color:C.muted,fontSize:12}}>{p.email}</p>
                    <p style={{color:C.muted,fontSize:11,marginTop:2}}>
                      Categorias: {(p.categories||[]).join(', ')||'—'} · 
                      Avaliação: {p.rating||'—'} ⭐
                    </p>
                  </div>
                  <div style={{textAlign:'right',flexShrink:0}}>
                    <div style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',
                      borderRadius:8,fontSize:11,fontWeight:700,
                      color:p.online?C.green:C.muted,
                      background:p.online?'rgba(0,212,106,.1)':'rgba(136,146,164,.1)',
                      border:`1px solid ${p.online?'rgba(0,212,106,.3)':'rgba(136,146,164,.3)'}`}}>
                      {p.online?'✓ Ativo':'Inativo'}
                    </div>
                    <p style={{color:C.sub,fontSize:10,marginTop:4}}>{p.reviews||0} avaliações</p>
                  </div>
                </div>
              ))}
              {!(data.providers||[]).length && <p style={{color:C.muted,textAlign:'center',padding:'40px 0'}}>Nenhum prestador</p>}
            </div>
          )}

        </div>
      </div>
    );
  }

  // Replace root with admin panel
  const adminRoot = document.getElementById('root');
  if(adminRoot) {
    ReactDOM.createRoot(adminRoot).render(React.createElement(AdminApp));
  }
})();
</script>
