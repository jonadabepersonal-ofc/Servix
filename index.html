<style>
:root{
  --dark:#0D1117;--carbon:#1A1F2E;--surface:#242938;--border:#2E3447;
  --green:#00D46A;--blue:#4A9EFF;--orange:#FF6B2B;--yellow:#FFD046;
  --red:#FF4757;--muted:#8892A4;--text:#E8EDF5;--sub:#4A5568;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;background:var(--dark)}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;animation:fadeIn .2s ease}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:3px}.scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%,100%{opacity:0;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
@keyframes radarSweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* TOPBAR */
.topbar{display:flex;align-items:center;padding:13px 16px 10px;border-bottom:1px solid var(--border);background:var(--carbon);flex-shrink:0;gap:10px}
.topbar h1{flex:1;font-size:17px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--text)}
.topbar .back{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;padding:2px 6px 2px 0;line-height:1}

/* NAV */
#nav{display:flex;background:rgba(26,31,46,.97);border-top:1px solid var(--border);padding:8px 0 max(12px,env(safe-area-inset-bottom));flex-shrink:0;backdrop-filter:blur(12px)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:4px 0;position:relative}
.nav-icon{font-size:21px;transition:filter .2s}
.nav-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub)}
.nav-btn.active .nav-label{color:var(--green)}
.nav-dot{width:4px;height:4px;border-radius:50%;background:var(--green);margin:0 auto}
.nav-badge{position:absolute;top:0;right:calc(50% - 18px);background:var(--red);color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* CARDS */
.card{background:var(--carbon);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700;white-space:nowrap}
.chip::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}

/* FORMS */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.inp{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-size:14px;width:100%;outline:none;font-family:inherit;box-sizing:border-box;transition:border-color .2s;-webkit-text-fill-color:var(--text)}
.inp:focus{border-color:var(--green)}
.inp::placeholder{color:var(--muted)}
textarea.inp{resize:none}
select.inp{appearance:auto;cursor:pointer}

/* BUTTONS */
.btn{border:none;border-radius:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:14px;padding:13px 20px;transition:transform .12s;user-select:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--green);color:var(--dark)}
.btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:rgba(255,71,87,.1);color:var(--red);border:1px solid rgba(255,71,87,.3)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn.full{width:100%}
.btn.sm{padding:9px 16px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}

/* PROGRESS BAR */
.progress-bar{height:3px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width .4s}

/* STATUS CHIPS */
.st-PENDING{color:#FFD046;background:rgba(255,208,70,.1);border-color:rgba(255,208,70,.3)}
.st-NEGOTIATING{color:#4A9EFF;background:rgba(74,158,255,.1);border-color:rgba(74,158,255,.3)}
.st-CONFIRMED{color:#00D46A;background:rgba(0,212,106,.1);border-color:rgba(0,212,106,.3)}
.st-IN_PROGRESS{color:#FF6B2B;background:rgba(255,107,43,.1);border-color:rgba(255,107,43,.3)}
.st-COMPLETED{color:#00D46A;background:rgba(0,212,106,.1);border-color:rgba(0,212,106,.3)}
.st-CANCELLED{color:#FF4757;background:rgba(255,71,87,.1);border-color:rgba(255,71,87,.3)}

/* RADAR */
#radar-svg{display:block;margin:0 auto}
.radar-sweep{transform-origin:100px 100px;animation:radarSweep 4s linear infinite}

/* MAP */
.tt-map{width:100%;height:170px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface);margin-bottom:12px}
.tt-fullscreen-button{display:none!important}

/* CTA */
.cta{margin:0 16px 16px;background:linear-gradient(135deg,#00D46A,#009E52);border-radius:18px;padding:20px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 32px rgba(0,212,106,.25);border:none;width:calc(100% - 32px);text-align:left}

/* TOAST */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--carbon);border:1px solid var(--border);border-radius:12px;padding:10px 20px;font-size:13px;font-weight:600;color:var(--text);z-index:900;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.7);transition:all .25s;opacity:0;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* WA FLOAT */
#wa-btn{position:fixed;bottom:84px;right:16px;width:48px;height:48px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:800;box-shadow:0 4px 16px rgba(37,211,102,.4);text-decoration:none;border:2px solid rgba(255,255,255,.15);cursor:pointer}

/* INSTALL BANNER */
#ib{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--carbon);border:1px solid var(--green);border-radius:14px;padding:12px 16px;display:none;align-items:center;gap:12px;z-index:9999;max-width:390px;width:calc(100% - 24px);box-shadow:0 8px 32px rgba(0,0,0,.7)}
#ib.show{display:flex}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:12px 0}

/* STARS */
.stars{color:var(--yellow);font-size:12px}

/* CATEGORY GRID */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.cat-btn{padding:14px 10px;border-radius:14px;border:2px solid var(--border);background:var(--carbon);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;transition:border-color .15s}
.cat-btn.sel,.cat-btn:hover{border-color:var(--green);background:rgba(0,212,106,.06)}
.cat-icon{font-size:26px}
.cat-label{font-size:11px;font-weight:600;color:var(--text);font-family:inherit;text-align:center;line-height:1.3}

/* PROPOSAL CARD */
.prop-card{background:var(--carbon);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}

/* PROFILE COVER */
.profile-cover{height:140px;background:linear-gradient(135deg,rgba(0,212,106,.1),rgba(74,158,255,.05));display:flex;align-items:flex-end;padding:0 16px 16px;position:relative;flex-shrink:0}

/* TOGGLE */
.toggle-track{width:50px;height:28px;border-radius:20px;position:relative;cursor:pointer;transition:all .25s;border:1px solid var(--border);flex-shrink:0}
.toggle-thumb{width:22px;height:22px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .25s;box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* ADMIN */
.admin-wrap{min-height:100vh;background:var(--dark);font-family:'DM Sans',sans-serif;color:var(--text)}
</style>
</head>

// ══════════════════════════════════════════════════════
// RADAR SVG
// ══════════════════════════════════════════════════════
let radarAF=null,radarAngle=0,radarVis=[];
const RDOTS=[{x:55,y:-40,n:'Roberto',d:'1.2km',a:35},{x:-48,y:55,n:'Marcos',d:'2.8km',a:225},{x:20,y:70,n:'Carlos',d:'3.4km',a:195},{x:-62,y:-22,n:'Ana',d:'4.1km',a:285}];
function stopRadar(){if(radarAF){cancelAnimationFrame(radarAF);radarAF=null;}radarVis=[];radarAngle=0;}
function startRadar(){
  let t0=null,prevAng=0;radarVis=[];
  const cx=100,cy=100,r=88;
  const toRad=a=>a*Math.PI/180;
  function draw(ts){
    if(!t0)t0=ts;
    const el=(ts-t0)/1000,na=(el*50)%360;
    radarAngle=na;
    RDOTS.forEach((d,i)=>{const cross=(prevAng<d.a&&na>=d.a)||(prevAng>300&&na<60&&d.a<60);if(cross&&!radarVis.includes(i))radarVis.push(i);});
    prevAng=na;
    const sx=cx+r*Math.cos(toRad(na-90)),sy=cy+r*Math.sin(toRad(na-90));
    const ex=cx+r*Math.cos(toRad(na-150)),ey=cy+r*Math.sin(toRad(na-150));
    const svg=document.getElementById('radar-svg');
    if(!svg){stopRadar();return;}
    const dotsSvg=radarVis.map(i=>`<circle cx="${cx+RDOTS[i].x}" cy="${cy+RDOTS[i].y}" r="6" fill="#FF6B2B"/><circle cx="${cx+RDOTS[i].x}" cy="${cy+RDOTS[i].y}" r="12" fill="#FF6B2B" opacity=".2" style="animation:ping 1.8s ease infinite"/>`).join('');
    svg.innerHTML=`<defs><radialGradient id="rg"><stop offset="0%" stop-color="#00D46A" stop-opacity=".5"/><stop offset="100%" stop-color="#00D46A" stop-opacity="0"/></radialGradient></defs>
      ${[33,66,88].map(rr=>`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="var(--border)" stroke-width=".8"/>`).join('')}
      <line x1="${cx}" y1="${cy-r-6}" x2="${cx}" y2="${cy+r+6}" stroke="var(--border)" stroke-width=".4"/>
      <line x1="${cx-r-6}" y1="${cy}" x2="${cx+r+6}" y2="${cy}" stroke="var(--border)" stroke-width=".4"/>
      <path d="M${cx} ${cy} L${sx} ${sy} A${r} ${r} 0 0 1 ${ex} ${ey} Z" fill="url(#rg)"/>
      <line x1="${cx}" y1="${cy}" x2="${sx}" y2="${sy}" stroke="#00D46A" stroke-width="2"/>
      <circle cx="${cx}" cy="${cy}" r="6" fill="#00D46A"/><circle cx="${cx}" cy="${cy}" r="12" fill="#00D46A" opacity=".15"/>
      ${dotsSvg}`;
    const info=document.getElementById('radar-info');
    if(info)info.innerHTML=radarVis.length===0?'<span style="color:var(--muted);font-size:12px">Varrendo 10km ao redor...</span>':radarVis.map(i=>`<span style="font-size:11px;color:#FF6B2B">${RDOTS[i].n} · ${RDOTS[i].d}</span>`).join('');
    radarAF=requestAnimationFrame(draw);
  }
  radarAF=requestAnimationFrame(draw);
}

let LOGIN_TAB='login', LOGIN_ROLE='client', LOGIN_CATS=[];
function switchLoginTab(t){
  LOGIN_TAB=t;
  $('tab-login').style.background=t==='login'?'var(--green)':'transparent';
  $('tab-login').style.color=t==='login'?'var(--dark)':'var(--muted)';
  $('tab-register').style.background=t==='register'?'var(--green)':'transparent';
  $('tab-register').style.color=t==='register'?'var(--dark)':'var(--muted)';
  $('name-field').style.display=t==='register'?'block':'none';
  $('cats-field').style.display=t==='register'&&LOGIN_ROLE==='provider'?'block':'none';
}
function setRole(r){
  LOGIN_ROLE=r;
  $('role-client').classList.toggle('sel',r==='client');
  $('role-provider').classList.toggle('sel',r==='provider');
  $('cats-field').style.display=LOGIN_TAB==='register'&&r==='provider'?'block':'none';
}
function toggleCat(v,btn){
  const idx=LOGIN_CATS.indexOf(v);
  if(idx>=0)LOGIN_CATS.splice(idx,1);else LOGIN_CATS.push(v);
  btn.classList.toggle('sel',LOGIN_CATS.includes(v));
  btn.querySelector('span:last-child').style.color=LOGIN_CATS.includes(v)?'var(--text)':'var(--muted)';
}
function quickDemo(role){
  $('inp-email').value=role==='client'?'carlos@servix.com':'roberto@servix.com';
  $('inp-pass').value='demo1234';
  setRole(role);LOGIN_TAB='login';
  switchLoginTab('login');
}
function showErr(msg){const e=$('login-err');e.textContent=msg;e.style.display='block';}

async function handleLogin(){
  const email=$('inp-email').value.trim();
  const pass=$('inp-pass').value;
  const name=($('inp-name')?.value||'').trim();
  if(!email||!pass){showErr('Preencha email e senha');return;}
  if(LOGIN_TAB==='register'&&!name){showErr('Informe seu nome');return;}
  $('login-btn').disabled=true;$('login-btn').innerHTML='<div class="spin"></div>';
  try{
    let uid=null,nm=name||email.split('@')[0];
    if(LOGIN_TAB==='register'){
      const{data,error}=await SB.auth.signUp({email,password:pass});
      if(error&&!error.message.includes('already'))throw error;
      uid=data.user?.id||genId();
    }else{
      const{data,error}=await SB.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
      uid=data.user?.id||genId();
    }
    await SB.from('profiles').upsert({id:uid,name:nm,email,role:LOGIN_ROLE,avatar:LOGIN_ROLE==='provider'?'👷':'👤',categories:LOGIN_CATS,city:CIDADE},{onConflict:'email'});
    const{data:p}=await SB.from('profiles').select('*').eq('id',uid).maybeSingle();
    USER={id:uid,...(p||{name:nm,email,role:LOGIN_ROLE,avatar:LOGIN_ROLE==='provider'?'👷':'👤',categories:LOGIN_CATS,rating:null,reviews:0})};
    LS.s('sx_user',USER);
    await loadServices();setupRealtime();
    toast('Bem-vindo, '+USER.name.split(' ')[0]+'! 👋');
    render('home');
  }catch(e){
    // fallback demo
    const uid=genId();
    USER={id:uid,name:name||email.split('@')[0],email,role:LOGIN_ROLE,avatar:LOGIN_ROLE==='provider'?'👷':'👤',categories:LOGIN_CATS,rating:null,reviews:0};
    LS.s('sx_user',USER);
    await loadServices();setupRealtime();
    toast('Bem-vindo, '+USER.name.split(' ')[0]+'! 👋');
    render('home');
  }
}
function attachLogin(){LOGIN_TAB='login';LOGIN_ROLE='client';LOGIN_CATS=[];}

function switchProvTab(tab,btn){

  const myProps=SVCS.filter(s=>(s.proposals||[]).some(p=>p.provider_id===USER.id));
  const myConf=SVCS.filter(s=>['CONFIRMED','IN_PROGRESS','COMPLETED'].includes(s.status)&&(s.proposals||[]).some(p=>p.provider_id===USER.id&&p.status==='ACCEPTED'));
  const openJobs=SVCS.filter(s=>['PENDING','NEGOTIATING'].includes(s.status)&&!(s.proposals||[]).some(p=>p.provider_id===USER.id));
  const avail=LS.g('sx_avail',true);

async function getGeo(){

    if(MAP_INSTANCE){try{MAP_INSTANCE.setCenter([REQ.lng,REQ.lat]);}catch{}}else initMap('req-map',REQ.lat,REQ.lng);

async function searchAddr(){

}

  const pr={id:genId(),service_id:svcId,provider_id:USER.id,provider_name:USER.name,avatar:USER.avatar||'👷',rating:USER.rating||4.8,reviews:USER.reviews||0,price:parseFloat(price),description:desc,hours:parseFloat($('pf-hours')?.value)||null,warranty:$('pf-warranty')?.value||null,status:'PENDING',created_at:new Date().toISOString()};
  try{await SB.from('proposals').insert([pr]);}catch(e){console.warn(e);}
  SVCS=SVCS.map(s=>s.id!==svcId?s:{...s,status:'NEGOTIATING',proposals:[...s.proposals,pr]});
  addNotif('💰','Proposta enviada!',`Proposta de ${fmtR(pr.price)} enviada.`);
  toast(`✅ Proposta de ${fmtR(pr.price)} enviada!`);
  render('service',svcId);
}
async function acceptProp(svcId,pId){
  const svc=SVCS.find(s=>s.id===svcId);if(!svc)return;
  const prop=svc.proposals.find(p=>p.id===pId);if(!prop)return;
  await SB.from('services').update({status:'CONFIRMED',final_price:prop.price}).eq('id',svcId).catch(()=>{});
  await SB.from('proposals').update({status:'ACCEPTED'}).eq('id',pId).catch(()=>{});
  await SB.from('proposals').update({status:'REJECTED'}).eq('service_id',svcId).neq('id',pId).catch(()=>{});
  SVCS=SVCS.map(s=>s.id!==svcId?s:{...s,status:'CONFIRMED',final_price:prop.price,proposals:s.proposals.map(p=>({...p,status:p.id===pId?'ACCEPTED':'REJECTED'}))});
  addNotif('🎉','Proposta aceita!','Faça o pagamento para confirmar.');
  toast('✅ Proposta aceita!');render('service',svcId);
}
async function rejectProp(svcId,pId){
  await SB.from('proposals').update({status:'REJECTED'}).eq('id',pId).catch(()=>{});
  SVCS=SVCS.map(s=>{if(s.id!==svcId)return s;const rem=s.proposals.filter(p=>p.id!==pId&&p.status==='PENDING');return{...s,status:rem.length>0?'NEGOTIATING':'PENDING',proposals:s.proposals.map(p=>({...p,status:p.id===pId?'REJECTED':p.status}))};});
  toast('Proposta recusada');render('service',svcId);
}
async function completeService(svcId){
  await SB.from('services').update({status:'COMPLETED',completed_at:new Date().toISOString()}).eq('id',svcId).catch(()=>{});
  SVCS=SVCS.map(s=>s.id===svcId?{...s,status:'COMPLETED'}:s);

async function submitRating(svcId){

function attachPayment(){PAY_METHOD='pix';generateQRPattern();}
function generateQRPattern(){
  const qr=$('qr-pattern');if(!qr)return;
  let svg='<svg width="140" height="140" viewBox="0 0 140 140">';
  for(let i=0;i<196;i++){const x=(i%14)*10,y=Math.floor(i/14)*10;const edge=(x<20&&y<20)||(x>100&&y<20)||(x<20&&y>100);svg+=`<rect x="${x}" y="${y}" width="9" height="9" rx="1" fill="${edge||Math.random()>.42?'var(--text)':'transparent'}"/>`;}
  svg+='</svg>';qr.innerHTML=svg;
}
function setPayMethod(m,btn){
  PAY_METHOD=m;
  $('pay-pix')?.classList.toggle('sel',m==='pix');
  $('pay-card')?.classList.toggle('sel',m==='card');
  $('pix-section').style.display=m==='pix'?'block':'none';

  $('pix-qr').style.display='none';
  $('pay-btn').textContent=m==='pix'?'📱 Gerar QR Code PIX':'💳 Pagar com cartão';
}

  if(PAY_METHOD==='card'){

}

      <p style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Dados da conta</p>
      ${[['Nome',USER.name],['E-mail',USER.email],['Tipo',USER.role==='client'?'👤 Cliente':'🔧 Prestador'],['Cidade',USER.city||CIDADE],USER.bio?['Bio',USER.bio]:null,USER.categories?.length?['Especialidades',USER.categories.map(c=>getCat(c).l).join(', ')]:null].filter(Boolean).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)"><span style="color:var(--muted);font-size:13px;flex-shrink:0">${k}</span><span style="font-size:13px;font-weight:600;text-align:right;max-width:60%;word-break:break-word">${esc(v)}</span></div>`).join('')}
    </div>
    <div class="card" style="margin-bottom:14px">
      <p style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">Suporte ServiX</p>
      <a href="https://wa.me/${WA_NUM}?text=Ol%C3%A1! Preciso de ajuda no ServiX." target="_blank" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);text-decoration:none"><span style="font-size:20px">💬</span><div><p style="font-size:13px;font-weight:600">WhatsApp</p><p style="color:var(--muted);font-size:11px">(21) 97104-6859</p></div><span style="margin-left:auto;color:var(--muted)">›</span></a>
      <a href="mailto:${SUPP_EMAIL}" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);text-decoration:none"><span style="font-size:20px">📧</span><div><p style="font-size:13px;font-weight:600">E-mail</p><p style="color:var(--muted);font-size:11px">${SUPP_EMAIL}</p></div><span style="margin-left:auto;color:var(--muted)">›</span></a>
      <a href="termos.html" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);text-decoration:none"><span style="font-size:20px">📋</span><div><p style="font-size:13px;font-weight:600">Termos e Privacidade (LGPD)</p><p style="color:var(--muted);font-size:11px">Sem vínculo empregatício</p></div><span style="margin-left:auto;color:var(--muted)">›</span></a>
      <a href="?admin=1" style="display:flex;align-items:center;gap:10px;padding:10px 0;text-decoration:none"><span style="font-size:20px">🔐</span><p style="font-size:13px;font-weight:600">Painel Admin</p><span style="margin-left:auto;color:var(--muted)">›</span></a>

    <button onclick="doLogout()" class="btn ghost full">🚪 Sair da conta</button>

function attachProfile(){updateNavActive('profile');}
let EDITING=false;
function toggleEdit(){EDITING=!EDITING;$('edit-form').style.display=EDITING?'block':'none';$('edit-btn').textContent=EDITING?'✕ Cancelar':'Editar';}
function saveProfile(){
  const name=$('edit-name')?.value.trim(),bio=$('edit-bio')?.value.trim();
  if(!name){toast('Informe seu nome');return;}
  USER={...USER,name,bio};LS.s('sx_user',USER);
  SB.from('profiles').update({name,bio}).eq('id',USER.id).catch(()=>{});
  toast('Perfil atualizado!');render('profile');
}
async function doLogout(){await SB.auth.signOut().catch(()=>{});LS.d('sx_user');USER=null;SVCS=[];if(realtimeChannel){SB.removeChannel(realtimeChannel);realtimeChannel=null;}render('login');}

// ══════════════════════════════════════════════════════
// ADMIN PANEL
// ══════════════════════════════════════════════════════
async function renderAdmin(){
  const inp=prompt('Senha do painel admin:');
  if(inp!==ADMIN_PASS){toast('Senha incorreta');history.back();return;}
  $('nav').style.display='none';$('wa-btn').style.display='none';
  $('app').innerHTML='<div style="text-align:center;padding:40px;color:var(--muted)"><div class="spin" style="margin:0 auto"></div><p style="margin-top:12px;font-size:13px">Carregando dados...</p></div>';
  try{
    const[sv,pr,tx]=await Promise.all([SB.from('services').select('*').order('created_at',{ascending:false}).limit(200),SB.from('profiles').select('*').eq('role','provider'),SB.from('transactions').select('*').order('created_at',{ascending:false}).limit(50)]);
    const svcs=sv.data||[],provs=pr.data||[],txs=tx.data||[];
    const comp=svcs.filter(s=>s.status==='COMPLETED');
    const gmv=comp.reduce((a,s)=>a+(s.final_price||0),0);
    const rev=txs.reduce((a,t)=>a+(t.platform_fee||0),0);
    const SC={PENDING:'#FFD046',NEGOTIATING:'#4A9EFF',CONFIRMED:'#00D46A',IN_PROGRESS:'#FF6B2B',COMPLETED:'#00D46A',CANCELLED:'#FF4757'};
    $('app').innerHTML=`
    <div style="min-height:100%;background:var(--dark);font-family:'DM Sans',sans-serif;color:var(--text);overflow-y:auto">
      <div style="background:var(--carbon);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10">
        <div style="display:flex;align-items:center;gap:10px"><span style="font-size:22px">🔧</span><div><h1 style="font-size:18px;font-weight:800;margin:0">ServiX Admin</h1><p style="color:var(--muted);font-size:11px;margin:0">${CIDADE}</p></div></div>
        <div style="display:flex;gap:8px">
          <button onclick="renderAdmin()" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--muted);cursor:pointer;font-size:12px;font-family:inherit">🔄 Atualizar</button>
          <button onclick="render('home')" style="background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.3);border-radius:8px;padding:6px 12px;color:var(--red);font-size:12px;cursor:pointer;font-family:inherit">Sair</button>
        </div>
      </div>
      <div style="padding:16px;max-width:800px;margin:0 auto">
        <h2 style="font-size:18px;font-weight:800;margin-bottom:14px">📊 Dashboard</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
          ${[{v:svcs.length,l:'Total serviços',c:'#4A9EFF'},{v:svcs.filter(s=>['PENDING','NEGOTIATING','CONFIRMED','IN_PROGRESS'].includes(s.status)).length,l:'Ativos',c:'#FF6B2B'},{v:comp.length,l:'Concluídos',c:'#00D46A'},{v:provs.length,l:'Prestadores',c:'#8B5CF6'},{v:fmtR(gmv),l:'Volume GMV',c:'#FFD046'},{v:fmtR(rev||gmv*TAXA),l:'Receita (4,99%)',c:'#00D46A'}].map(s=>`<div style="background:var(--carbon);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center"><div style="font-weight:900;font-size:24px;color:${s.c}">${s.v}</div><div style="color:var(--muted);font-size:11px;margin-top:4px;text-transform:uppercase;letter-spacing:.06em">${s.l}</div></div>`).join('')}
        </div>
        <h2 style="font-size:16px;font-weight:800;margin-bottom:12px">📋 Serviços recentes</h2>
        ${svcs.slice(0,20).map(sv=>`<div style="background:var(--carbon);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px">
            <div style="flex:1"><p style="font-weight:700;font-size:14px;margin-bottom:2px">${esc(sv.title)}</p><p style="color:var(--muted);font-size:12px">📍 ${esc(sv.address)}</p><p style="color:var(--muted);font-size:11px;margin-top:2px">${sv.client_name||sv.client_id?.slice(0,8)} · ${new Date(sv.created_at).toLocaleDateString('pt-BR')}</p></div>
            <div style="text-align:right;flex-shrink:0"><span style="display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700;color:${SC[sv.status]||'#8892A4'};background:${(SC[sv.status]||'#8892A4')}15;border:1px solid ${(SC[sv.status]||'#8892A4')}40;margin-bottom:6px">${sv.status}</span>${sv.final_price?`<p style="color:var(--green);font-weight:700;font-size:13px">${fmtR(sv.final_price)}</p>`:''}</div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${['CONFIRMED','IN_PROGRESS','COMPLETED','CANCELLED'].map(st=>`<button onclick="adminUpdSvc('${sv.id}','${st}')" style="padding:5px 10px;border-radius:8px;border:1px solid ${SC[st]}40;background:${sv.status===st?SC[st]+'20':'transparent'};color:${sv.status===st?SC[st]:'var(--muted)'};font-size:10px;font-weight:600;cursor:pointer;font-family:inherit">${st}</button>`).join('')}
          </div>
        </div>`).join('')}
        <h2 style="font-size:16px;font-weight:800;margin-bottom:12px;margin-top:20px">🔧 Prestadores</h2>
        ${provs.map(p=>`<div style="background:var(--carbon);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center">
          <div style="width:46px;height:46px;background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">${p.avatar||'👷'}</div>
          <div style="flex:1"><p style="font-weight:700;font-size:14px">${esc(p.name)}</p><p style="color:var(--muted);font-size:12px">${esc(p.email)}</p><p style="color:var(--muted);font-size:11px;margin-top:2px">${(p.categories||[]).join(', ')||'—'}</p></div>
          <div style="text-align:right;flex-shrink:0"><span style="display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700;color:${p.online?'var(--green)':'var(--muted)'};background:${p.online?'rgba(0,212,106,.1)':'rgba(136,146,164,.1)'};border:1px solid ${p.online?'rgba(0,212,106,.3)':'rgba(136,146,164,.3)'}">${p.online?'✓ Ativo':'Inativo'}</span><p style="color:var(--sub);font-size:10px;margin-top:4px">${p.reviews||0} aval.</p></div>
        </div>`).join('')}
      </div>
    </div>`;
    window.adminUpdSvc=async(id,status)=>{await SB.from('services').update({status}).eq('id',id);toast('Status atualizado!');setTimeout(renderAdmin,500);};
  }catch(e){$('app').innerHTML=`<div style="padding:40px;text-align:center;color:var(--red)">Erro: ${esc(e.message)}<br><br><button onclick="render('home')" class="btn secondary">← Voltar</button></div>`;}
}

function updateNavActive(sc){
  document.querySelectorAll('.nav-btn').forEach(b=>{const id=b.dataset.screen;b.classList.toggle('active',id===sc);const dot=b.querySelector('.nav-dot');if(dot)dot.style.display=id===sc?'block':'none';const icon=b.querySelector('.nav-icon');if(icon)icon.style.filter=id===sc?'none':'grayscale(1) opacity(.4)';});
  updateNavBadge();
}

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
// Check admin route
if(new URLSearchParams(location.search).get('admin')==='1'){
  document.getElementById('app').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px"><div class="spin"></div><p style="color:var(--muted);font-size:13px">Abrindo admin...</p></div>';
  setTimeout(renderAdmin,200);
}else if(USER){
  loadServices().then(()=>{setupRealtime();render('home');});
}else{
  render('login');
}

let dp;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('ib').classList.add('show');});

$('bd').addEventListener('click',()=>$('ib').classList.remove('show'));
window.addEventListener('appinstalled',()=>$('ib').classList.remove('show'));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
